<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div class="settings">
    <label for="difficulty">Difficulty</label>
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
  </div>
  <p id="timer" aria-live="off">Time: 00:00</p>
  <div id="sudoku-board" role="grid" aria-label="Sudoku puzzle"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check</button>
    <p id="message" role="status" aria-live="polite"></p>
  </div>
  <section class="leaderboard" aria-labelledby="leaderboard-title">
    <h2 id="leaderboard-title">Top 10</h2>
    <table>
      <thead>
        <tr>
          <th scope="col">Rank</th>
          <th scope="col">Name</th>
          <th scope="col">Time</th>
          <th scope="col">Difficulty</th>
          <th scope="col">Hints</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body"></tbody>
    </table>
  </section>
  <script src="/static/main.js"></script>
</body>
</html>
